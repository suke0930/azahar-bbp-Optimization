name: BBP 作業メモ
description: バンブラP / BBP 向けの調査、修正、移植、ビルド作業を記録する
title: "[BBP] "
labels: ["bbp"]
body:
  - type: markdown
    attributes:
      value: |
        このテンプレートは、BBP / バンブラP 向けの個人用 fork 作業を記録するためのものです。
        内容は先に brainstorming で固めてから issue 化する想定です。

  - type: dropdown
    id: kind
    attributes:
      label: 種別
      description: この issue の主な種類を選んでください。
      options:
        - 調査
        - 実装
        - パッチ移植
        - ビルド / リリース
        - 検証
        - ドキュメント
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: 何を達成したい issue かを短く書く。
      placeholder: BBP のノート不可視と縦グリッド欠けを、個人 fork 向けの互換 fix として整理する。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景 / 現状
      description: 症状、調査結果、関連 build、関連ログなど。
      placeholder: |
        - 症状:
        - 関連 build:
        - 関連 env:
        - 既に分かっていること:
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 作業内容
      description: この issue でやること。未確定なら候補でもよい。
      placeholder: |
        - [ ] azahar-sorce 側の該当差分を確認する
        - [ ] fork 側に移植する最小範囲を決める
        - [ ] ビルドして BBP で確認する
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 何が満たされれば close できるか。
      placeholder: |
        - 対象パッチが fork に入っている
        - BBP の対象シーンで症状が再発しない
        - 変更内容と検証結果が記録されている
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: メモ
      description: 関連リンク、注意点、後回しにすることなど。
    validations:
      required: false
