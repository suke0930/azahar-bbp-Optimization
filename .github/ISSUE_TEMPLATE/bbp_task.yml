name: BBP 問題メモ
description: バンブラP / BBP で見えた問題を、まずユーザー視点で記録する
title: "[BBP] "
labels: ["bbp"]
body:
  - type: markdown
    attributes:
      value: |
        このテンプレートは、BBP / バンブラP で見えた問題をまず記録するためのものです。
        原因、調査結果、修正計画は本文に詰め込まず、後続コメントで追記します。

  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: エンドユーザー視点で、何が困る問題かを書く。
      placeholder: ノートレーン上の一部ノートが見えなくなる。判定や音は進むが、画面上のノート表示が欠ける。
    validations:
      required: true

  - type: textarea
    id: scene
    attributes:
      label: 発生場面
      description: どの画面、曲、操作、build、設定で見えたか。
      placeholder: |
        - 画面 / モード:
        - 曲 / セーブ状態:
        - 関連 build:
        - 関連 env:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される表示 / 動作
      description: 本来どう見える、または動くべきか。
      placeholder: ノート、縦グリッド、レーン表示が実機相当のタイミングと位置で表示される。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の表示 / 動作
      description: 実際に何が起きたか。見た目の変化を優先して書く。
      placeholder: 一部のノートが透明になり、右側の縦グリッドも欠ける。曲の進行や判定は続く。
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: 再現性
      description: 同じ条件でどれくらい再現するか。
      options:
        - 毎回再現する
        - だいたい再現する
        - ときどき再現する
        - まだ不明
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響
      description: プレイ、表示確認、検証作業にどの程度影響するか。
      placeholder: ノートが見えないため、譜面確認や通常プレイに支障がある。
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: スクリーンショット、動画、ログ、比較対象、後で見るべきメモなど。
    validations:
      required: false
